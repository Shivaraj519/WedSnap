[WedSnap]
# Backend API Base URL (cloud or staging)
backend_url = http://localhost:8000
# Device API Token obtained from Admin Dashboard or pairing screen
device_token = wds_demo_device_token_replace_me
# Target wedding slug or ID
wedding_slug = sophia-alexander

[ADB]
# ADB executable path (defaults to system PATH adb)
adb_path = adb
# Polling interval in seconds
poll_interval_seconds = 2
# Camera directories to monitor on Android device
phone_camera_path = /sdcard/DCIM/Camera
# Local staging folder for pulled photos before upload
local_staging_dir = ./staging_cache
