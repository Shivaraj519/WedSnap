[WedSnap]
backend_url = http://localhost:8000
device_token = wds_demo_dslr_token_replace_me
wedding_slug = sophia-alexander

[Tethering]
# Adapter choices: 'canon', 'sony', 'nikon', 'folder', 'ftp'
adapter = folder

# Hot folder path monitored for incoming DSLR captures
# Common defaults:
# Canon EOS Utility: C:/Users/<User>/Pictures/EOS Utility
# Sony Imaging Edge: C:/Users/<User>/Pictures/Imaging Edge
# Nikon NX Tether:   C:/Users/<User>/Pictures/Nikon
watch_folder = ./incoming_dslr_photos

# Time to wait (seconds) for camera to finish writing RAW/JPEG
write_settle_delay = 1.0

[FTP_Server]
# Built-in Wi-Fi FTP Receiver for wireless camera direct transmission
enabled = false
port = 2121
user = wedsnap
password = camera
storage_dir = ./ftp_incoming
